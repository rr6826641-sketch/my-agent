name: Upload Release Asset v19

on:
  push:
    branches: [release-bin]

permissions:
  contents: write

jobs:
  upload-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure release v19 exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v19 --repo rr6826641-sketch/my-agent \
            || gh release create v19 \
                 --repo rr6826641-sketch/my-agent \
                 --title "MyAgentUltra v19 - ULTRA EXTRA ULTRA POWERFUL EDITION (LLM SPEED UPGRADE / FUSION X7 NEXUS DELTA / JDX)" \
                 --notes "v19 LLM SPEED UPGRADE (built from source): keep-alive connection pool, fast-fail net, jittered backoff, parallel local probe, one-shot prewarm. FUSION X7 NEXUS DELTA / JDX branding retained."

      - name: Upload MyAgentUltra.exe to release v19
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/MyAgentUltra.exe
          gh release upload v19 dist/MyAgentUltra.exe --clobber --repo rr6826641-sketch/my-agent
          echo "ASSET_UPLOADED_OK"
